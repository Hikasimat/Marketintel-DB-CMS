name: Deploy Backend to AWS ECS (OIDC)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ecs-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # Required for requesting the JWT OIDC token from GitHub
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'marketintel-db-cms' }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'marketintel-cms-cluster' }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE || 'marketintel-cms-service' }}
  ECS_TASK_DEFINITION: aws/ecs/task-definition.json
  CONTAINER_NAME: cms-backend

jobs:
  deploy:
    name: Build & Deploy Backend Service to AWS ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::796498481393:role/github-actions-marketintel-cms-role' }}
          role-session-name: GitHubActionsECSDeploy
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Building production Docker image: $IMAGE_URI"
          docker build \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            --file Dockerfile .

          echo "Pushing image to AWS ECR..."
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Task Definition to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
