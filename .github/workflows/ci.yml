name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    name: Lint, Types, and Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip install -r requirements/dev.txt -r requirements/base.txt

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Lint check (Ruff)
        run: ruff check .

      - name: Type check (Mypy)
        run: mypy apps/common apps/accounts

      - name: SAST security scan (Bandit)
        run: bandit -r apps -c pyproject.toml

      - name: Supply-chain dependency audit (pip-audit)
        run: pip-audit -r requirements/base.txt

  test-suite:
    name: PostgreSQL & Redis Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_cms
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip install -r requirements/dev.txt -r requirements/base.txt

      - name: Verify migrations from clean DB
        env:
          POSTGRES_DB: test_cms
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run test suite with coverage
        env:
          POSTGRES_DB: test_cms
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest --cov=apps --cov=cms --cov-report=term-missing --cov-fail-under=80

      - name: Validate OpenAPI 3 Schema
        run: |
          python manage.py spectacular --validate --fail-on-warn --file openapi.yaml

      - name: Django production deployment check
        env:
          DJANGO_SECRET_KEY: "dummy-prod-secret-key-that-is-at-least-50-characters-long-for-ci"
          DJANGO_ALLOWED_HOSTS: "api.example.com"
          PUBLIC_BASE_URL: "https://api.example.com"
          POSTGRES_DB: "prod_cms"
          POSTGRES_USER: "prod_user"
          POSTGRES_PASSWORD: "prod_password"
          REDIS_URL: "rediss://prod-redis:6379/0"
        run: |
          DJANGO_SETTINGS_MODULE=cms.settings.prod python manage.py check --deploy

  docker-build:
    name: Docker Image Build Smoke Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cms-backend:latest
