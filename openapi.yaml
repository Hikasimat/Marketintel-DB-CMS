        robots_index:
          type: boolean
        robots_follow:
          type: boolean
        open_graph:
          type: object
          additionalProperties: {}
        twitter:
          type: object
          additionalProperties: {}
        json_ld:
          type: object
          additionalProperties: {}
        json_ld_html:
          type: string
      required:
      - canonical_url
      - json_ld
      - json_ld_html
      - meta_description
      - open_graph
      - robots
      - robots_follow
      - robots_index
      - title
      - twitter
    RedirectRule:
      type: object
