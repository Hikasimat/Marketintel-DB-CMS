openapi: 3.0.3
info:
  title: Headless CMS API
  version: 1.0.0
  description: Standalone, API-only multi-tenant headless CMS backend.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate via email/password and obtain access + refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Tokens successfully issued
        '400':
          description: Invalid request or credentials
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke active refresh token family and terminate session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '204':
          description: Session terminated
        '400':
          description: Invalid token payload
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve details for the currently authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rotate refresh token to obtain a new access token and refreshed
        lineage token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Token successfully rotated
        '401':
          description: Token expired, invalid, or reused
  /api/v1/workspaces/:
    get:
      operationId: workspaces_list
      description: List workspaces the user belongs to, or create a new workspace.
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: workspaces_create
      description: List workspaces the user belongs to, or create a new workspace.
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '400':
          description: Validation error
  /api/v1/workspaces/{workspace_id}/:
    get:
      operationId: workspaces_retrieve
      description: Retrieve, update, or delete a specific workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: Workspace not found
    patch:
      operationId: workspaces_partial_update
      description: Retrieve, update, or delete a specific workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceCreateRequest'
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    delete:
      operationId: workspaces_destroy
      description: Retrieve, update, or delete a specific workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '204':
          description: Workspace deleted
  /api/v1/workspaces/{workspace_id}/audit-logs/:
    get:
      operationId: workspaces_audit_logs_list
      description: Retrieve immutable audit trail records for a workspace.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/workspaces/{workspace_id}/members/:
    get:
      operationId: workspaces_members_list
      description: List or invite/add members in a workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMembership'
          description: ''
    post:
      operationId: workspaces_members_create
      description: List or invite/add members in a workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAddRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
          description: ''
  /api/v1/workspaces/{workspace_id}/members/{member_id}/:
    patch:
      operationId: workspaces_members_partial_update
      description: Change member role or remove member from workspace.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberUpdateRequest'
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
          description: ''
    delete:
      operationId: workspaces_members_destroy
      description: Change member role or remove member from workspace.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '204':
          description: Member removed
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        payload:
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - actor_id
      - id
      - ip_address
      - payload
      - resource_id
      - resource_type
      - timestamp
      - user_agent
      - workspace_id
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PaginatedAuditEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    PatchedWorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
    PatchedWorkspaceMemberUpdateRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    RoleEnum:
      enum:
      - OWNER
      - ADMIN
      - EDITOR
      - ANALYST
      type: string
      description: |-
        * `OWNER` - Owner
        * `ADMIN` - Admin
        * `EDITOR` - Editor
        * `ANALYST` - Analyst
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_active
      - is_staff
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        current_user_role:
          type: string
          nullable: true
          readOnly: true
      required:
      - created_at
      - current_user_role
      - id
      - name
      - slug
      - updated_at
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
    WorkspaceMemberAddRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: EDITOR
      required:
      - email
    WorkspaceMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
      - user
  securitySchemes:
    externalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
