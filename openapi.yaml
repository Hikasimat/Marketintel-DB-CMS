openapi: 3.0.3
info:
  title: Headless CMS API
  version: 1.0.0
  description: Standalone, API-only multi-tenant headless CMS backend.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate via email/password and obtain access + refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Tokens successfully issued
        '400':
          description: Invalid request or credentials
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke active refresh token family and terminate session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '204':
          description: Session terminated
        '400':
          description: Invalid token payload
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve details for the currently authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rotate refresh token to obtain a new access token and refreshed
        lineage token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Token successfully rotated
        '401':
          description: Token expired, invalid, or reused
  /api/v1/public/sites/{site_slug}/{key_file}:
    get:
      operationId: public_sites_retrieve
      description: Public endpoint to serve the IndexNow verification key file (e.g.
        /<key>.txt).
      summary: IndexNow key file delivery
      parameters:
      - in: path
        name: key_file
        schema:
          type: string
          pattern: ^[^/]+\.txt$
        required: true
      - in: path
        name: site_slug
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        required: true
      tags:
      - public
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      - {}
      responses:
        '200':
          description: IndexNow key text
        '404':
          description: Key not found
  /api/v1/public/sites/{site_slug}/analytics-config:
    get:
      operationId: public_sites_analytics_config_retrieve
      description: Public endpoint providing safe, non-secret analytics IDs for browser
        loaders (ANA-1).
      summary: Public analytics client configuration
      parameters:
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAnalyticsConfig'
          description: ''
        '404':
          description: Site not found
  /api/v1/public/sites/{site_slug}/analytics-config/:
    get:
      operationId: public_sites_analytics_config_retrieve_2
      description: Public endpoint providing safe, non-secret analytics IDs for browser
