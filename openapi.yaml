components:
  schemas:
    AnalyticsEventTypeEnum:
      enum:
      - page_view
      - cta_click
      - form_submit
      type: string
      description: |-
        * `page_view` - Page View
        * `cta_click` - CTA Click
        * `form_submit` - Form Submit
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        body:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        status:
          $ref: '#/components/schemas/ArticleStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        metadata: {}
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        versions_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - slug
      - title
      - updated_at
      - versions_count
    ArticleCreateUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
