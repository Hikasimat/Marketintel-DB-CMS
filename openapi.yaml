      - source_path
      - target_url
      - updated_at
    RedirectRuleRequest:
      type: object
      properties:
        source_path:
          type: string
          minLength: 1
          maxLength: 500
        target_url:
          type: string
          minLength: 1
          maxLength: 500
        status_code:
          allOf:
          - $ref: '#/components/schemas/StatusCodeEnum'
          default: 301
        is_active:
          type: boolean
      required:
      - source_path
      - target_url
    RoleEnum:
      enum:
      - OWNER
      - ADMIN
      - EDITOR
      - ANALYST
      type: string
      description: |-
        * `OWNER` - Owner
        * `ADMIN` - Admin
        * `EDITOR` - Editor
        * `ANALYST` - Analyst
    SEOAuditItem:
      type: object
      properties:
        article_id:
          type: string
        slug:
          type: string
        field:
          type: string
        severity:
          type: string
        code:
          type: string
        message:
          type: string
        remediation:
          type: string
      required:
