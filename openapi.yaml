        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      - {}
      responses:
        '202':
          description: Event accepted
        '400':
          description: Invalid event
  /api/v1/public/sites/{site_slug}/articles/:
    get:
      operationId: public_sites_articles_list
      description: Public read-only content delivery endpoint for published articles
        (CT-4, CT-6).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicArticleList'
          description: ''
        '404':
          description: Site not found
  /api/v1/public/sites/{site_slug}/articles/{article_slug}/:
    get:
      operationId: public_sites_articles_retrieve
      description: Public read-only content delivery endpoint for a single published
        article (CT-4, CT-6).
      parameters:
      - in: path
        name: article_slug
        schema:
          type: string
        required: true
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticle'
          description: ''
        '404':
          description: Article not found
  /api/v1/public/sites/{site_slug}/articles/{article_slug}/seo/:
    get:
      operationId: public_sites_articles_seo_retrieve
      description: |-
        Serve structured SEO metadata, canonicals, and JSON-LD for frontend rendering.

        Requirements satisfied: SEO-1, SEO-9.
      parameters:
      - in: path
        name: article_slug
        schema:
          type: string
        required: true
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSEOMetadata'
          description: ''
        '404':
          description: Article not found
  /api/v1/public/sites/{site_slug}/consent:
