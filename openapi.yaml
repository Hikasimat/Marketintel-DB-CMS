          nullable: true
          readOnly: true
      required:
      - created_at
      - current_user_role
      - id
      - name
      - slug
      - updated_at
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
    WorkspaceMemberAddRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: EDITOR
      required:
      - email
    WorkspaceMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
      - user
  securitySchemes:
    externalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
