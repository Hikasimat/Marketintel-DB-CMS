  /api/v1/public/sites/{site_slug}/analytics/events:
    post:
      operationId: public_sites_analytics_events_create
      description: Ingest privacy-preserving first-party analytics events (ANA-4,
        ANA-5, ANA-6).
      summary: Ingest first-party event
      parameters:
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngestRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      - {}
      responses:
        '202':
          description: Event accepted
        '400':
          description: Invalid event
  /api/v1/public/sites/{site_slug}/analytics/events/:
    post:
      operationId: public_sites_analytics_events_create_2
      description: Ingest privacy-preserving first-party analytics events (ANA-4,
