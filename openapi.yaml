        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainVerifyRequestRequest'
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
          description: ''
        '400':
          description: Verification failed
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        body:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        metadata: {}
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        versions_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - slug
      - title
      - updated_at
      - versions_count
    ArticleCreateUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        body:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        metadata: {}
      required:
      - title
    ArticleVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version_number:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        excerpt:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - created_by
      - excerpt
      - id
      - metadata
      - title
      - version_number
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        payload:
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - actor_id
      - id
      - ip_address
      - payload
      - resource_id
      - resource_type
      - timestamp
      - user_agent
      - workspace_id
    ContentTypeEnum:
      enum:
      - POST
      - PAGE
      - CASE_STUDY
      - DOC
      type: string
      description: |-
        * `POST` - Blog Post
        * `PAGE` - Static Page
        * `CASE_STUDY` - Case Study
        * `DOC` - Documentation
    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        hostname:
          type: string
          maxLength: 253
        is_primary:
          type: boolean
        verification_token:
          type: string
          format: uuid
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ssl_status:
          type: string
          readOnly: true
        dns_verification_record:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dns_verification_record
      - hostname
      - id
      - is_verified
      - ssl_status
      - updated_at
      - verification_token
      - verified_at
    DomainCreateRequest:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        is_primary:
          type: boolean
      required:
      - hostname
    DomainVerifyRequestRequest:
      type: object
      properties:
        simulate_success:
          type: boolean
          default: true
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MediaAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        file_size:
          type: integer
          readOnly: true
        storage_path:
          type: string
          readOnly: true
        checksum_sha256:
          type: string
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checksum_sha256
      - content_type
      - created_at
      - file_size
      - filename
      - id
      - storage_path
      - updated_at
      - uploaded_by
    MediaAssetCreateRequest:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          minLength: 1
          maxLength: 100
        file_size:
          type: integer
          maximum: 10485760
          minimum: 1
        storage_path:
          type: string
          minLength: 1
          maxLength: 500
        checksum_sha256:
          type: string
          minLength: 1
          default: ''
          maxLength: 64
      required:
      - content_type
      - file_size
      - filename
      - storage_path
    PaginatedArticleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Article'
    PaginatedAuditEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    PaginatedMediaAssetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    PaginatedPublicArticleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicArticle'
    PatchedArticleCreateUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        body:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        metadata: {}
    PatchedSiteCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        default_locale:
          type: string
          minLength: 1
          maxLength: 20
        theme_config: {}
        settings: {}
        allowed_origins: {}
        is_active:
          type: boolean
    PatchedWorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
    PatchedWorkspaceMemberUpdateRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PublicArticle:
      type: object
      description: Clean, public-facing representation of published articles.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        content_type:
          allOf:
          - $ref: '#/components/schemas/ContentTypeEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
      required:
      - body
      - content_type
      - excerpt
      - id
      - metadata
      - published_at
      - slug
      - title
    RoleEnum:
      enum:
      - OWNER
      - ADMIN
      - EDITOR
      - ANALYST
      type: string
      description: |-
        * `OWNER` - Owner
        * `ADMIN` - Admin
        * `EDITOR` - Editor
        * `ANALYST` - Analyst
    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        default_locale:
          type: string
          maxLength: 20
        theme_config: {}
        settings: {}
        allowed_origins: {}
        is_active:
          type: boolean
        primary_domain:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - primary_domain
      - slug
      - updated_at
    SiteCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        default_locale:
          type: string
          minLength: 1
          maxLength: 20
        theme_config: {}
        settings: {}
        allowed_origins: {}
        is_active:
          type: boolean
      required:
      - name
    StatusEnum:
      enum:
      - DRAFT
      - IN_REVIEW
      - PUBLISHED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `IN_REVIEW` - In Review
        * `PUBLISHED` - Published
        * `ARCHIVED` - Archived
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_active
      - is_staff
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        current_user_role:
