      - version
    PrivacyPolicyVersionRequest:
      type: object
      description: Serializer for privacy policy versions.
      properties:
        version:
          type: string
          minLength: 1
          description: Version identifier (e.g. '1.0', '2026.1').
          maxLength: 50
        title:
          type: string
          minLength: 1
          description: Policy version title.
          maxLength: 255
        summary:
          type: string
          description: Summary of major changes.
        body:
          type: string
          description: Full markdown or text policy content.
        effective_date:
          type: string
          format: date-time
      required:
      - title
      - version
    ProviderEnum:
      enum:
      - GOOGLE
      - BING
      - INDEXNOW
      type: string
      description: |-
        * `GOOGLE` - Google Search Console
        * `BING` - Bing Webmaster Tools
        * `INDEXNOW` - IndexNow
    PublicAnalyticsConfig:
      type: object
      description: Public serializer delivering only non-secret IDs for browser frontend
        loaders (ANA-1).
      properties:
        measurement_id:
          type: string
          readOnly: true
        gtm_container_id:
          type: string
          readOnly: true
        is_first_party_enabled:
          type: boolean
          readOnly: true
          description: Toggle first-party privacy-preserving event ingestion (default
            off).
        require_consent:
          type: boolean
          readOnly: true
          description: Whether event collection requires explicit visitor consent.
      required:
      - gtm_container_id
      - is_first_party_enabled
      - measurement_id
      - require_consent
    PublicArticle:
      type: object
      description: Clean, public-facing representation of published articles.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        content_type:
          allOf:
          - $ref: '#/components/schemas/ContentTypeEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
      required:
      - body
      - content_type
      - excerpt
      - id
      - metadata
      - published_at
      - slug
      - title
    PublicBannerConfig:
      type: object
      description: Contract serializer for browser/SDK consent banner loading (CON-2).
      properties:
        is_enabled:
          type: boolean
        jurisdiction_mode:
          $ref: '#/components/schemas/JurisdictionModeEnum'
        cookie_domain:
          type: string
        active_policy:
          type: object
          additionalProperties: {}
          nullable: true
        categories:
          type: object
          additionalProperties: {}
        default_states:
          type: object
          additionalProperties: {}
        gcm_enabled:
          type: boolean
        gcm_defaults:
          type: object
          additionalProperties: {}
      required:
      - active_policy
      - categories
      - cookie_domain
      - default_states
      - gcm_defaults
      - gcm_enabled
      - is_enabled
      - jurisdiction_mode
    PublicConsentStatus:
      type: object
      description: Response serializer for public visitor consent status inquiry.
      properties:
        has_consent_record:
          type: boolean
        record_id:
          type: string
        status:
          type: string
        categories:
          type: object
          additionalProperties: {}
        recorded_at:
          type: string
        expires_at:
          type: string
        policy_version:
          type: string
          nullable: true
        requires_reconsent:
          type: boolean
        is_withdrawn:
          type: boolean
      required:
      - categories
      - has_consent_record
      - is_withdrawn
      - policy_version
      - requires_reconsent
      - status
    PublicConsentSubmitRequest:
      type: object
      description: Payload serializer for visitor submitting consent choices (CON-3).
      properties:
        visitor_id:
          type: string
          minLength: 1
          maxLength: 128
        policy_version:
          type: string
