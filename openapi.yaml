      - slug
    SearchEngineConnection:
      type: object
      description: Serializer for search engine API connections with write-only credentials
        (SEC-3).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/ConnectionStatusEnum'
          readOnly: true
        last_synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error_message:
          type: string
          readOnly: true
        settings: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error_message
      - id
      - last_synced_at
      - provider
      - status
      - updated_at
    SearchEngineConnectionRequest:
      type: object
      description: Serializer for search engine API connections with write-only credentials
        (SEC-3).
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        settings: {}
        credentials:
          type: string
          writeOnly: true
          description: Raw API key or access token. Will be encrypted at rest with
            AES-256-GCM.
      required:
      - provider
    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        default_locale:
          type: string
          maxLength: 20
        theme_config: {}
        settings: {}
        allowed_origins: {}
        is_active:
          type: boolean
        primary_domain:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - primary_domain
      - slug
      - updated_at
    SiteAnalyticsConfig:
      type: object
      description: Serializer for managing site analytics settings (ANA-1).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        measurement_id:
          type: string
          maxLength: 30
        gtm_container_id:
          type: string
          maxLength: 30
        is_first_party_enabled:
          type: boolean
          description: Toggle first-party privacy-preserving event ingestion (default
            off).
        retention_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Event data retention window in days before automated pruning
            (7-730 days).
        require_consent:
          type: boolean
          description: Whether event collection requires explicit visitor consent.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    SiteConsentConfig:
      type: object
      description: Serializer for per-site consent configuration (CON-1).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        site_id:
          type: string
          format: uuid
          readOnly: true
        is_enabled:
          type: boolean
          description: Master switch for consent management on this site.
        jurisdiction_mode:
          allOf:
          - $ref: '#/components/schemas/JurisdictionModeEnum'
          description: |-
            Jurisdiction compliance mode determining default gating rules.

            * `GDPR` - GDPR (Strict Opt-in)
            * `CCPA_CPRA` - CCPA/CPRA (Opt-out)
            * `GLOBAL_OPT_IN` - Global Opt-in
            * `GLOBAL_OPT_OUT` - Global Opt-out
        retention_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Consent record retention duration in days (30 to 1095 days).
        cookie_domain:
          type: string
          description: Optional root cookie domain for subdomains.
          maxLength: 255
        active_policy_version:
          type: string
          format: uuid
          nullable: true
          description: Currently active privacy policy version for visitor consent.
        active_policy_version_detail:
          allOf:
          - $ref: '#/components/schemas/PrivacyPolicyVersion'
          readOnly: true
        categories:
          description: Extended custom categories dictionary. Adding new optional
            categories never enables them silently (CON-5).
        all_categories:
          type: object
          additionalProperties: {}
          readOnly: true
        gcm_enabled:
          type: boolean
          description: Support Google Consent Mode v2 signal dispatch contract.
        gcm_default_analytics_storage:
          $ref: '#/components/schemas/GCMStateEnum'
        gcm_default_ad_storage:
          $ref: '#/components/schemas/GCMStateEnum'
        gcm_default_ad_user_data:
          $ref: '#/components/schemas/GCMStateEnum'
        gcm_default_ad_personalization:
          $ref: '#/components/schemas/GCMStateEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_policy_version_detail
      - all_categories
      - created_at
      - id
      - site_id
      - updated_at
    SiteCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        default_locale:
          type: string
          minLength: 1
          maxLength: 20
        theme_config: {}
