          maxLength: 50
        categories:
          type: object
          additionalProperties:
            type: boolean
        consent_type:
          type: string
          minLength: 1
          default: EXPLICIT_OPT_IN
      required:
      - categories
      - visitor_id
    PublicConsentWithdrawRequest:
      type: object
      description: Payload serializer for visitor withdrawing all consent (CON-4).
      properties:
        visitor_id:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - visitor_id
    PublicSEOMetadata:
      type: object
