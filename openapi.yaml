components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        body:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        status:
          $ref: '#/components/schemas/ArticleStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        metadata: {}
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        versions_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - slug
      - title
      - updated_at
      - versions_count
    ArticleCreateUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        body:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        status:
          $ref: '#/components/schemas/ArticleStatusEnum'
        metadata: {}
      required:
      - title
    ArticleSEO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        meta_title:
          type: string
          maxLength: 200
        meta_description:
          type: string
          maxLength: 320
        canonical_url:
          type: string
          maxLength: 500
        robots_index:
          type: boolean
        robots_follow:
          type: boolean
        og_title:
          type: string
          maxLength: 200
        og_description:
          type: string
          maxLength: 320
        og_image_url:
          type: string
          maxLength: 500
        twitter_card:
          type: string
          maxLength: 50
        jsonld_schema: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    ArticleStatusEnum:
      enum:
      - DRAFT
      - IN_REVIEW
      - PUBLISHED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `IN_REVIEW` - In Review
        * `PUBLISHED` - Published
        * `ARCHIVED` - Archived
    ArticleVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version_number:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        excerpt:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - created_by
      - excerpt
      - id
      - metadata
      - title
      - version_number
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
