openapi: 3.0.3
info:
  title: Headless CMS API
  version: 1.0.0
  description: Standalone, API-only multi-tenant headless CMS backend.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate via email/password and obtain access + refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Tokens successfully issued
        '400':
          description: Invalid request or credentials
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke active refresh token family and terminate session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '204':
          description: Session terminated
        '400':
          description: Invalid token payload
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve details for the currently authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rotate refresh token to obtain a new access token and refreshed
        lineage token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Token successfully rotated
        '401':
          description: Token expired, invalid, or reused
  /api/v1/public/sites/{site_slug}/articles/:
    get:
      operationId: public_sites_articles_list
      description: Public read-only content delivery endpoint for published articles
        (CT-4, CT-6).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicArticleList'
          description: ''
        '404':
          description: Site not found
  /api/v1/public/sites/{site_slug}/articles/{article_slug}/:
    get:
      operationId: public_sites_articles_retrieve
      description: Public read-only content delivery endpoint for a single published
        article (CT-4, CT-6).
      parameters:
      - in: path
        name: article_slug
        schema:
          type: string
        required: true
      - in: path
        name: site_slug
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticle'
          description: ''
        '404':
          description: Article not found
  /api/v1/workspaces/:
    get:
      operationId: workspaces_list
      description: List workspaces the user belongs to, or create a new workspace.
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: workspaces_create
      description: List workspaces the user belongs to, or create a new workspace.
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '400':
          description: Validation error
  /api/v1/workspaces/{workspace_id}/:
    get:
      operationId: workspaces_retrieve
      description: Retrieve, update, or delete a specific workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: Workspace not found
    patch:
      operationId: workspaces_partial_update
      description: Retrieve, update, or delete a specific workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceCreateRequest'
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    delete:
      operationId: workspaces_destroy
      description: Retrieve, update, or delete a specific workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '204':
          description: Workspace deleted
  /api/v1/workspaces/{workspace_id}/audit-logs/:
    get:
      operationId: workspaces_audit_logs_list
      description: Retrieve immutable audit trail records for a workspace.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/workspaces/{workspace_id}/media/:
    get:
      operationId: workspaces_media_list
      description: List or catalog media assets in a workspace.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssetList'
          description: ''
    post:
      operationId: workspaces_media_create
      description: List or catalog media assets in a workspace.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAssetCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
        '400':
          description: Validation error
  /api/v1/workspaces/{workspace_id}/members/:
    get:
      operationId: workspaces_members_list
      description: List or invite/add members in a workspace.
      parameters:
      - in: path
        name: workspace_id
