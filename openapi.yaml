          description: ''
  /api/v1/workspaces/{workspace_id}/members/{member_id}/:
    patch:
      operationId: workspaces_members_partial_update
      description: Change member role or remove member from workspace.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberUpdateRequest'
      security:
      - jwtAuth: []
      - externalBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
          description: ''
    delete:
      operationId: workspaces_members_destroy
      description: Change member role or remove member from workspace.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
